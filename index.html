<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/style.css">
  <title>FlowBoard</title>
</head>

<body>
  <div class="wrapper">
    
    <div class="brand">
      <div class="logo">FlowBoard</div>
      <div class="subText">A tiny kanban board for one person productivity</div>
    </div>

    <div class="board">
      <div class="column" id="todo">
        <div class="column-header">
          <div class="left">
            <div class="heading">To Do</div>
            <div class="subHeading">{n} Tasks</div>
          </div>
          <div class="right">
            <div class="add-icon">+</div>
          </div>
        </div>
        <div class="task-card">
          <div id="task-title">Complete research project</div>
          <div id="task-description">Read LLMs can brainrot paper</div>
          <div id="difficulty">Medium</div>
          <div id="due-date">Nov 31, 2025</div>
        </div>
      </div>
      <div class="column" id="progress">
        <div class="column-header">
          <div class="left">
            <div class="heading">In Progress</div>
            <div class="subHeading">{n} Tasks</div>
          </div>
          <div class="right">
            <div class="add-icon">+</div>
          </div>
        </div>
        <div class="task-card"></div>
      </div>
      <div class="column" id="done">
        <div class="column-header">
          <div class="left">
            <div class="heading">Done</div>
            <div class="subHeading">{n} Tasks</div>
          </div>
          <div class="right">
            <div class="add-icon">+</div>
          </div>
        <div class="task-card"></div>

        </div>
      </div>
    </div>

  </div>
</body>
</html>
